name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check i18n files
        run: |
          node <<'EOF'
          const fs = require('fs');
          const load = f => JSON.parse(fs.readFileSync(f, 'utf8'));
          const vi = Object.keys(load('i18n/vi.json'));
          const en = Object.keys(load('i18n/en.json'));
          const html = fs.readFileSync('index.html', 'utf8');
          const used = [...html.matchAll(/data-i18n(?:-aria)?="([^"]+)"/g)].map(m => m[1]);
          const errors = [
            ...vi.filter(k => !en.includes(k)).map(k => `${k} is in vi.json but not en.json`),
            ...en.filter(k => !vi.includes(k)).map(k => `${k} is in en.json but not vi.json`),
            ...[...new Set(used)].filter(k => !vi.includes(k) && !en.includes(k)).map(k => `${k} is used in index.html but missing from both files`),
          ];
          if (errors.length) { errors.forEach(e => console.error(e)); process.exit(1); }
          console.log(`OK: ${vi.length} keys`);
          EOF

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
